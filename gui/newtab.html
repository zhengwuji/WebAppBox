<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>WebAppBox 浏览器环境</title>
<style>
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
         font-family: "Segoe UI","Microsoft YaHei",sans-serif; background:#f6f7f9; color:#333; }
  .logo { font-size: 22px; font-weight: 600; margin: 8px 0 6px; }
  .logo-img { border-radius: 14px; box-shadow: 0 4px 14px rgba(0,0,0,.15); }
  .sub { font-size: 12px; opacity: .6; margin-bottom: 26px; }
  .box { width: min(640px, 86vw); background:#fff; border:1px solid #e3e5e8; border-radius: 14px;
         padding: 10px 14px; display:flex; gap:10px; box-shadow: 0 6px 24px rgba(0,0,0,.06); }
  input { flex:1; border:none; outline:none; font-size:14px; background:transparent; color:#333; }
  button { border:none; background:#2080f0; color:#fff; border-radius:8px; padding:8px 18px; cursor:pointer; font-size:13px; }
  .quick { margin-top:22px; display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
  .quick a { text-decoration:none; font-size:13px; padding:8px 16px; border-radius:999px;
             background:rgba(32,128,240,.08); color:#2080f0; }
  .hint { margin-top: 30px; font-size: 12px; opacity: .5; }
  @media (prefers-color-scheme: dark){
    body{background:#1f1f23;color:#ddd;}
    .box{background:#2a2a2e;border-color:#3a3a3f;}
    input{color:#eee;}
    .quick a{background:rgba(32,128,240,.18);}
  }
</style>
</head>

<script>
  function normalize(v){
    v = (v || '').trim();
    if (!v) return '';
    if (/^https?:\/\//i.test(v) || /^file:/i.test(v)) return v;
    if (/^[\w-]+(\.[\w-]+)+(:\d+)?(\/.*)?$/.test(v)) return 'https://' + v;
    return 'https://www.google.com/search?q=' + encodeURIComponent(v);
  }
  function go(){
    var url = normalize(document.getElementById('addr').value);
    if (url) window.location.href = url;
  }
  document.getElementById('addr').addEventListener('keydown', function(e){ if (e.key === 'Enter') go(); });
  document.querySelectorAll('.quick a').forEach(function(a){
    a.addEventListener('click', function(e){ e.preventDefault(); window.location.href = a.dataset.url; });
  });
</script>
